<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScriBBler</title>


  <link href="https://fonts.googleapis.com/css?family=Montez&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Ubuntu+Mono&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/index.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <h1 class="logo">ScriBBler</h1>
      <p class="tagline">Explore, Imagine, Create</p>
    </div>
    <div class="auth-buttons">
      <button type="button" class="btn-blue" id="signUpBtn">Sign Up</button>
      <button type="button" class="btn-blue" id="signInBtn">Sign In</button>
    </div>
  </header>

  <div class="modal" id="signUpModal">
    <div class="modal-content small-modal">
      <div class="modal-header">
        <h2>Get Started</h2>
        <span class="close-btn" id="closeSignUp"><i class="fa fa-times"></i></span>
      </div>
      <form id="signUpForm">
        <label for="signUpName">Name</label>
        <input type="text" id="signUpName" placeholder="Enter your name" required>

        <label for="signUpUsername">Username</label>
        <input type="text" id="signUpUsername" placeholder="Enter your username" required>

        <label for="signUpPassword">Password</label>
        <input type="password" id="signUpPassword" placeholder="Enter your password" required>

        <label for="signUpConfirm">Confirm Password</label>
        <input type="password" id="signUpConfirm" placeholder="Re-enter your password" required>

        <button type="submit" class="btn-green full-width">Sign Up</button>
      </form>
    </div>
  </div>

  <div class="modal" id="signInModal">
    <div class="modal-content small-modal">
      <div class="modal-header">
        <h2>Welcome Back!</h2>
        <span class="close-btn" id="closeSignIn"><i class="fa fa-times"></i></span>
      </div>
      <form id="signInForm">
        <label for="signInUsername">Username</label>
        <input type="text" id="signInUsername" placeholder="Enter your username" required>

        <label for="signInPassword">Password</label>
        <input type="password" id="signInPassword" placeholder="Enter your password" required>

        <button type="submit" class="btn-green full-width">Sign In</button>
      </form>
      <p class="switch-text">Not a member? <a href="#" id="switchToSignUp">Sign Up</a></p>
    </div>
  </div>


  <main class="center-buttons">
    <button type="button" class="btn-yellow" id="allPostsBtn">All Posts</button>
    <button type="button" class="btn-yellow" id="createPostBtn">Create Post</button>
  </main>

  <div class="modal" id="createPostModal">
    <div class="modal-content wide-modal">
      <div class="modal-header">
        <h2>Pen Your Post</h2>
        <span class="close-btn" id="closeCreatePost"><i class="fa fa-times"></i></span>
      </div>
      <form id="createPostForm">
        <label for="postTitle">Title</label>
        <input type="text" id="postTitle" placeholder="Enter title of your post">

        <label for="postContents">Contents</label>
        <textarea id="postContents" placeholder="Enter the contents of your post"></textarea>

        <div class="center-row">
          <button type="button" class="btn-green" id="createBtn">Create</button>
        </div>
      </form>
    </div>
  </div>
  <script src="scripts/common.js"></script>
  <script src="scripts/index.js"></script>
</body>
</html>
